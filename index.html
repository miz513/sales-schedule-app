<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スケジュール管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>スケジュール管理</title>
<link rel="stylesheet" href="style.css?v=48">
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-gate-box">
    <div class="auth-gate-title">スケジュール管理</div>
    <div id="authGateLoading" class="auth-gate-loading">
      <div class="spin-penguin" aria-hidden="true">🐧</div>
      <div>読み込み中…</div>
    </div>
    <div id="authGatePrompt" class="hidden">
      <div id="inAppBrowserWarning" class="in-app-warning hidden">
        <strong>LINEなどのアプリ内ブラウザではログインできません。</strong>
        画面右下の「•••」または共有アイコンから「他のアプリで開く」「Safariで開く」などを選び、標準のブラウザで開き直してください。
      </div>
      <p>ご利用にはGoogleアカウントでのログインが必要です。</p>
      <button id="btnGateSignIn" class="primary-btn">Googleでログイン</button>
      <p id="authGateError" class="auth-gate-error"></p>
    </div>
  </div>
</div>

<div class="app">

  <header class="topbar">
    <div class="topbar-center">
      <div class="header-mascot" aria-hidden="true">
        <svg class="mascot-penguin mascot-parent" viewBox="0 0 40 50" width="26" height="32">
          <g class="mp-body">
            <ellipse cx="20" cy="26" rx="16" ry="20" fill="#20242c"/>
            <ellipse cx="20" cy="30" rx="10" ry="14" fill="#ffffff"/>
            <g class="mp-flipper-left"><ellipse cx="8" cy="26" rx="4" ry="10" fill="#20242c"/></g>
            <g class="mp-flipper-right"><ellipse cx="32" cy="26" rx="4" ry="10" fill="#20242c"/></g>
            <g class="mp-head">
              <circle cx="20" cy="10" r="9" fill="#20242c"/>
              <path d="M20 10 L28 8 L28 14 Z" fill="#f6a723"/>
              <circle cx="17" cy="8" r="1.8" fill="#fff"/>
              <circle cx="17.3" cy="8" r="0.9" fill="#161616"/>
            </g>
            <path d="M13 44 L18 48 L20 44 Z" fill="#f6a723"/>
            <path d="M27 44 L22 48 L20 44 Z" fill="#f6a723"/>
          </g>
        </svg>
        <svg class="mascot-penguin mascot-child" viewBox="0 0 40 50" width="16" height="20">
          <g class="mp-body">
            <ellipse cx="20" cy="26" rx="16" ry="20" fill="#20242c"/>
            <ellipse cx="20" cy="30" rx="10" ry="14" fill="#ffffff"/>
            <g class="mp-flipper-left"><ellipse cx="8" cy="26" rx="4" ry="10" fill="#20242c"/></g>
            <g class="mp-flipper-right"><ellipse cx="32" cy="26" rx="4" ry="10" fill="#20242c"/></g>
            <g class="mp-head">
              <circle cx="20" cy="10" r="9" fill="#20242c"/>
              <path d="M20 10 L28 8 L28 14 Z" fill="#f6a723"/>
              <circle cx="17" cy="8" r="1.8" fill="#fff"/>
              <circle cx="17.3" cy="8" r="0.9" fill="#161616"/>
            </g>
            <path d="M13 44 L18 48 L20 44 Z" fill="#f6a723"/>
            <path d="M27 44 L22 48 L20 44 Z" fill="#f6a723"/>
          </g>
        </svg>
      </div>
      <span id="periodLabel" class="period-label" title="タップして年月を選択"></span>
      <button id="btnToday" class="today-btn" type="button">今日</button>
    </div>
  </header>

  <div class="filter-bar">
    <span class="filter-label">絞り込み:</span>
    <div id="categoryChips" class="chips-container"></div>
    <button id="btnManageCategories" class="icon-btn" title="種別を管理">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    </button>
  </div>

  <main id="mainArea" class="main-area">
    <!-- 月表示・週表示はJSで描画 -->
  </main>

  <nav class="bottom-bar">
    <button id="btnMonthView" class="bottom-bar-btn active" data-view="month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4M16 3v4"></path></svg>
      <span>月</span>
    </button>
    <button id="btnWeekView" class="bottom-bar-btn" data-view="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16M15 4v16"></path></svg>
      <span>週</span>
    </button>
    <div class="bottom-bar-center">
      <button id="btnNewEvent" class="bottom-bar-fab" title="予定を追加" aria-label="予定を追加">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <span>追加</span>
    </div>
    <button id="btnMemo" class="bottom-bar-btn" title="メモ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span>メモ</span>
    </button>
    <div class="bottom-bar-menu-wrap">
      <button id="btnMenu" class="bottom-bar-btn" title="メニュー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <span>メニュー</span>
      </button>
      <div id="menuDropdown" class="menu-dropdown hidden">
        <button id="btnSignIn">Googleでログイン（同期）</button>
        <button id="btnSignOut" class="hidden">ログアウト</button>
        <div id="syncStatus" class="sync-status"></div>
        <button id="btnEnableNotify">予定の通知を有効にする</button>
        <div id="notifyStatus" class="sync-status"></div>
        <button id="btnMonthlySummary">月次集計</button>
      </div>
    </div>
  </nav>

  <div id="undoToast" class="undo-toast hidden">
    <span id="undoToastText"></span>
    <button type="button" id="btnUndo">元に戻す</button>
  </div>

</div>

<!-- 日詳細モーダル -->
<div id="dayModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="dayModalTitle">予定</h2>
      <button class="close-btn" data-close="dayModal">×</button>
    </div>
    <div id="dayModalList" class="day-event-list"></div>
    <button id="btnAddInDay" class="primary-btn full-width">＋ この日に予定を追加</button>
  </div>
</div>

<!-- 予定編集モーダル -->
<div id="eventModal" class="modal-overlay hidden">
  <div class="modal modal-scrollable">
    <div class="modal-header">
      <h2 id="eventModalTitle">予定を追加</h2>
      <button class="close-btn" data-close="eventModal">×</button>
    </div>
    <form id="eventForm" class="modal-form">
      <div class="modal-body">
        <input type="hidden" id="eventId">

        <div class="form-row compact-row date-time-row">
          <div class="dt-field dt-date">
            <label>開始日</label>
            <input type="date" id="eventStartDate" required>
          </div>
          <div class="dt-field dt-time" id="startTimeField">
            <label>開始時刻</label>
            <input type="time" id="eventStartTime">
          </div>
        </div>

        <div class="form-row compact-row date-time-row">
          <div class="dt-field dt-date">
            <label>終了日</label>
            <input type="date" id="eventEndDate" required>
          </div>
          <div class="dt-field dt-time" id="endTimeField">
            <label>終了時刻</label>
            <input type="time" id="eventEndTime">
          </div>
        </div>

        <div class="form-row compact-row checkbox-row">
          <label class="allday-check">
            <input type="checkbox" id="eventAllDay">
            終日
          </label>
          <label class="allday-check" id="repeatRow">
            <input type="checkbox" id="eventRepeatWeekly">
            毎週繰り返す
          </label>
        </div>
        <div class="form-row hidden" id="repeatDaysRow">
          <label>繰り返す曜日</label>
          <div class="weekday-picker" id="repeatWeekdayPicker">
            <label class="wd-chip"><input type="checkbox" value="0">日</label>
            <label class="wd-chip"><input type="checkbox" value="1">月</label>
            <label class="wd-chip"><input type="checkbox" value="2">火</label>
            <label class="wd-chip"><input type="checkbox" value="3">水</label>
            <label class="wd-chip"><input type="checkbox" value="4">木</label>
            <label class="wd-chip"><input type="checkbox" value="5">金</label>
            <label class="wd-chip"><input type="checkbox" value="6">土</label>
          </div>
        </div>
        <div class="form-row hidden" id="repeatUntilRow">
          <label>繰り返しの終了日</label>
          <input type="date" id="eventRepeatUntil">
        </div>

        <div class="form-row">
          <label>種別</label>
          <div class="category-select-row">
            <select id="eventCategory"></select>
            <button type="button" id="btnAddCategoryInline" class="secondary-btn" title="新しい種別を追加">＋ 種別を追加</button>
          </div>
          <div id="titleSuggestions" class="suggestion-list hidden"></div>
        </div>

        <div class="form-row">
          <label>タイトル</label>
          <input type="text" id="eventTitle" required>
        </div>

        <div class="form-row">
          <label>メモ</label>
          <textarea id="eventNotes" rows="10"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" id="btnDeleteEvent" class="danger-btn hidden">削除</button>
        <button type="button" id="btnDuplicateEvent" class="secondary-btn hidden">複製</button>
        <div class="spacer"></div>
        <button type="button" class="secondary-btn" data-close="eventModal">キャンセル</button>
        <button type="submit" class="primary-btn">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 年月選択モーダル -->
<div id="yearMonthModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>年月を選択</h2>
      <button class="close-btn" data-close="yearMonthModal">×</button>
    </div>
    <div class="year-nav">
      <button type="button" id="btnYearPrev" aria-label="前の年">‹</button>
      <span id="yearMonthYearLabel"></span>
      <button type="button" id="btnYearNext" aria-label="次の年">›</button>
    </div>
    <div id="monthPickerGrid" class="month-picker-grid"></div>
  </div>
</div>

<!-- メモ一覧モーダル -->
<div id="memoModal" class="modal-overlay fullscreen hidden">
  <div class="modal modal-scrollable">
    <div class="modal-header">
      <h2>メモ</h2>
      <button class="close-btn" data-close="memoModal">×</button>
    </div>
    <div class="modal-body">
      <div id="memoList" class="memo-list"></div>
    </div>
    <div class="form-actions">
      <button id="btnAddMemo" class="primary-btn full-width">＋ 新しいメモ</button>
    </div>
  </div>
</div>

<!-- メモ編集モーダル -->
<div id="memoEditModal" class="modal-overlay fullscreen hidden">
  <div class="modal modal-scrollable">
    <div class="modal-header">
      <h2 id="memoEditModalTitle">メモ</h2>
      <button class="close-btn" data-close="memoEditModal">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="memoId">
      <div class="form-row">
        <label>タイトル</label>
        <input type="text" id="memoTitleInput" placeholder="例：買い物リスト">
      </div>
      <div class="form-row">
        <label>色</label>
        <input type="color" id="memoColorInput" value="#16a34a">
      </div>
      <div class="form-row">
        <label>種類</label>
        <div class="memo-type-toggle">
          <label class="memo-type-option">
            <input type="radio" name="memoType" value="text" checked>
            通常メモ
          </label>
          <label class="memo-type-option">
            <input type="radio" name="memoType" value="checklist">
            チェックリスト
          </label>
        </div>
      </div>
      <div class="form-row" id="memoTextSection">
        <label>内容</label>
        <textarea id="memoContentInput" rows="8" placeholder="自由にメモを書けます"></textarea>
      </div>
      <div class="form-row hidden" id="memoChecklistSection">
        <label>項目</label>
        <div id="memoItemsList" class="memo-items-list"></div>
        <button type="button" id="btnAddMemoItem" class="secondary-btn">＋ 項目を追加</button>
      </div>
      <button type="button" id="btnNotifyMemoNow" class="secondary-btn full-width">今すぐ通知に出す</button>
    </div>
    <div class="form-actions">
      <button type="button" id="btnDeleteMemo" class="danger-btn hidden">削除</button>
      <div class="spacer"></div>
      <button type="button" class="secondary-btn" data-close="memoEditModal">キャンセル</button>
      <button type="button" id="btnSaveMemo" class="primary-btn">保存</button>
    </div>
  </div>
</div>

<!-- 種別管理モーダル -->
<div id="categoryModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>種別を管理</h2>
      <button class="close-btn" data-close="categoryModal">×</button>
    </div>
    <p class="hint-text">各項目を長押ししてドラッグすると、並び順を変更できます。</p>
    <div id="categoryList" class="category-list"></div>

    <div class="add-category-form">
      <label>新しい種別を追加</label>
      <div class="add-category-row">
        <input type="color" id="newCategoryColor" value="#0891b2">
        <input type="text" id="newCategoryName" placeholder="例：セミナー登壇">
        <button type="button" id="btnAddCategory" class="primary-btn">追加</button>
      </div>
    </div>
  </div>
</div>

<!-- 月次集計モーダル -->
<div id="summaryModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="summaryModalTitle">月次集計</h2>
      <button class="close-btn" data-close="summaryModal">×</button>
    </div>
    <div id="summaryModalBody"></div>
  </div>
</div>

<script src="app.js?v=49"></script>
<script type="module" src="firebase-sync.js?v=8"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js?v=2");
  }
</script>
</body>
</html>
